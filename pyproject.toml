[project]
name = "deployforge"
version = "0.3.0"
description = "AI-Powered Universal Project Deployment Engine"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "email-validator>=2.0.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "redis",
    "celery",
    "httpx",
    "aiofiles",
    "google-genai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "python-multipart",
    "pygit2",
    "tree-sitter",
    "pyyaml",
    "toml",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
deployforge = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "core", "db", "workers", "sdk"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
