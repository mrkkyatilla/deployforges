# Single VPS deployment (no Docker Swarm).
# From deployforge repo root: docker compose -f deploy/docker-compose.vps.yml --env-file .env up -d
#
# Requires .env in repo root with DB_PASSWORD and all DF_* vars.

services:
  workspace-init:
    build:
      context: ..
      dockerfile: Dockerfile
    user: root
    volumes:
      - deployforge_workspace:/tmp/deployforge/workspaces
    command:
      - sh
      - -c
      - mkdir -p /tmp/deployforge/workspaces && chown -R app:app /tmp/deployforge/workspaces
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      DF_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/deployforge
      DF_REDIS_URL: redis://redis:6379/0
    volumes:
      - deployforge_workspace:/tmp/deployforge/workspaces
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A workers.build_worker worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DF_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/deployforge
      DF_REDIS_URL: redis://redis:6379/0
    volumes:
      - deployforge_workspace:/tmp/deployforge/workspaces
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A workers.build_worker beat --loglevel=info
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DF_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deployforge
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  deployforge_workspace:
  caddy_data:
  caddy_config:
